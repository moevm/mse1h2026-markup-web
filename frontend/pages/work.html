<!doctype html>
<html lang="ru">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>BestSoftWeb</title>

  <link rel="shortcut icon" href="/img/svg/logo.svg" type="image/x-icon" />

  <link rel="stylesheet" href="/css/fonts/inter.css" />
  <link rel="stylesheet" href="/css/root.css" />
  <link rel="stylesheet" href="/css/minimize.css" />
  <link rel="stylesheet" href="/css/app/app.css" />
  <link rel="stylesheet" href="/css/animations.css" />
  <link rel="stylesheet" href="/css/header/header.css" />
  <link rel="stylesheet" href="/css/footer/footer.css" />

  <link rel="stylesheet" href="/css/workPage/sectionWorkSpace.css" />
  <link rel="stylesheet" href="/css/workPage/sectionWorkSpaceAside.css" />
  <link rel="stylesheet" href="/css/workPage/sectionWorkSpaceMain.css" />
  <link rel="stylesheet" href="/css/workPage/modal.css" />
</head>

<body>
  <header class="header">
    <nav class="header__navigation">
      <a class="header__link header__link--logo" href="/">BestSoftWeb</a>
      <a class="header__link" href="/work">Рабочая область</a>
      <a class="header__link" href="/datasets">Датасеты</a>
      <a class="header__link header__link--profile" href="/stats"></a>
    </nav>
  </header>
  <main id="app">
    <section class="section-workspace">
      <aside class="section-workspace__aside section-workspace__aside--images">
        <div class="section-workspace__category-slider">
          <button class="section-workspace__slider-btn section-workspace__slider-btn--prev">
            ←
          </button>
          <h3 class="section-workspace__category-title" id="current-category">
            В ОЖИДАНИИ
          </h3>
          <button class="section-workspace__slider-btn section-workspace__slider-btn--next">
            →
          </button>
        </div>
        <ul class="section-workspace__images-list" id="images-list">
        </ul>
      </aside>

      <section class="section-workspace__main">
        <div class="section-workspace__toolbar">
          <h2 class="section-workspace__dataset-name" id="dataset-name">
            Название датасета
          </h2>
          <div class="section-workspace__dataset-model">
            <h2 class="section-workspace__dataset-model-name" id="dataset-model"></h2>
            <button class="section-workspace__button--change-model" id="change-model-button">Изменить модель</button>
            <button class="section-workspace__button--change-model" id="change-model-hyperparams-button">Изменить гиперпараметры</button>
          </div>
          <div class="section-workspace__toolbar-image-actions">
            <button class="section-workspace__tool-btn section-workspace__tool-btn--active" id="btn-select" title="S">
              <img class="section-workspace__tool-btn-image" src="/img/svg/hand-icon.svg" alt="" />
            </button>
            <button class="section-workspace__tool-btn" id="btn-draw" title="D">
              <img class="section-workspace__tool-btn-image" src="/img/svg/goto-markup-icon.svg" alt="" />
            </button>
            <button class="section-workspace__tool-btn section-workspace__tool-btn--danger" id="btn-delete-sel">
              <img class="section-workspace__tool-btn-image" src="/img/svg/delete-icon.svg" alt="" />
            </button>
          </div>
          <div class="section-workspace__toolbar-server-actions">
            <div class="section-workspace__auto-markup-box">
              <div class="section-workspace__auto-markup-row">
                <label for="auto-markup-count">Разметить автоматически:</label>
                <input type="number" id="auto-markup-count" min="1" placeholder="Кол-во"
                  class="section-workspace__auto-markup-input" value="5" />
                <button
                  class="section-workspace__toolbar-server-button section-workspace__toolbar-server-button--auto-markup">
                  Запустить
                </button>
              </div>
              <div class="section-workspace__conf-filter">
                <label class="section-workspace__conf-filter-label">
                  <input type="checkbox" id="conf-filter-enabled" />
                  Автопринятие по порогу уверенности
                </label>
                <div class="section-workspace__conf-filter-controls" id="conf-filter-controls">
                  <label for="conf-filter-threshold">Порог (0–1):</label>
                  <input type="number" id="conf-filter-threshold" min="0" max="1" step="0.01" value="0.85"
                    class="section-workspace__conf-filter-input" />
                  <button id="conf-filter-save"
                    class="section-workspace__toolbar-server-button section-workspace__toolbar-server-button--save-threshold">
                    Сохранить
                  </button>
                </div>
              </div>
            </div>
            <button class="section-workspace__toolbar-server-button section-workspace__toolbar-server-button--recheck">
              <img src="/img/svg/to-markup-icon.svg" alt="recheck-icon" />
              Подтвердить и отправить
            </button>
            <div class="section-workspace__decision-box">
              <button class="section-workspace__decision-button section-workspace__decision-button--accept">
                <img src="/img/svg/accept-icon.svg" alt="accept-icon" />
                Принять
              </button>
              <button class="section-workspace__decision-button section-workspace__decision-button--reject">
                <img class="section-workspace__button-image" src="/img/svg/reject-icon.svg" alt="reject-icon" />
                Отклонить
              </button>
            </div>
          </div>
        </div>

        <div class="detection-scene mode-select" id="scene">
          <img id="scene-img" src="https://images.unsplash.com/photo-1506521781263-d8422e82f27a?w=680&q=80"
            alt="detection scene" />
          <div class="detection-layer" id="detection-layer"></div>
        </div>

        <div class="edit-popup" id="edit-popup">
          <div>
            <label>Метка</label>
            <select id="pop-class-select"></select>
            <input id="pop-new-label" placeholder="Название нового класса" style="display:none" />
          </div>
          <div>
            <label>Класс / цвет</label>
            <select id="pop-class">
              <option value="blue">синий</option>
              <option value="yellow">жёлтый</option>
              <option value="red">красный</option>
              <option value="green">зелёный</option>
              <option value="purple">фиолетовый</option>
            </select>
          </div>
          <div>
            <label>Уверенность (0–1)</label>
            <input type="number" id="pop-conf" min="0" max="1" step="0.01" />
          </div>
          <div>
            <label>Позиция / размер (%)</label>
            <div class="popup-row">
              <input type="number" id="pop-x" placeholder="x" step="0.1" />
              <input type="number" id="pop-y" placeholder="y" step="0.1" />
              <input type="number" id="pop-w" placeholder="w" step="0.1" />
              <input type="number" id="pop-h" placeholder="h" step="0.1" />
            </div>
          </div>
          <button class="popup-close" id="pop-close">закрыть</button>
        </div>
        <div class="section-workspace__fast-actions-box"></div>
      </section>

      <aside class="section-workspace__aside section-workspace__aside--classes">
        <div class="section-workspace__object-list-box">
          <h3 class="section-workspace__title">СПИСОК ОБЪЕКТОВ</h3>
          <ul class="section-workspace__object-list">
            <li class="section-workspace__object-item">
              <button class="section-workspace__object-button section-workspace__object-button--selected">
                <div class="section-workspace__object-main-data">
                  <h4 class="section-workspace__object-title">Машина #1</h4>
                  <h5 class="section-workspace__object-sub-title">
                    ID: veh_8291
                  </h5>
                </div>
                <div class="section-workspace__object-sub-data section-workspace__object-sub-data--high-percent">
                  98%
                </div>
              </button>
            </li>
            <li class="section-workspace__object-item">
              <button class="section-workspace__object-button">
                <div class="section-workspace__object-main-data">
                  <h4 class="section-workspace__object-title">Человек #1</h4>
                  <h5 class="section-workspace__object-sub-title">
                    ID: ped_0122
                  </h5>
                </div>
                <div class="section-workspace__object-sub-data section-workspace__object-sub-data--low-medium-percent">
                  45%
                </div>
              </button>
            </li>
          </ul>
        </div>
      </aside>
    </section>
  </main>
  <footer class="footer">
    <p class="footer-text">@Команда крутых перцев</p>
  </footer>
  <div></div>
  <div class="change-model-overlay" id="change-model-overlay" style="display:none">
    <div class="change-model-modal">
      <div class="change-model-modal__header">
        <h3 class="change-model-modal__title">Изменить модель</h3>
        <button class="change-model-modal__close" id="change-model-close" aria-label="Закрыть">&times;</button>
      </div>
      <div class="change-model-modal__body">
        <div class="change-model-modal__current" id="change-model-current-label">
          Текущая модель: <strong id="change-model-current-name"></strong>
        </div>
        <label class="change-model-modal__label" for="change-model-select">Выберите архитектуру</label>
        <select class="change-model-modal__select" id="change-model-select"></select>
        <div class="change-model-modal__info" id="change-model-info">
          <div class="change-model-modal__info-name" id="change-model-info-name"></div>
          <div class="change-model-modal__info-desc" id="change-model-info-desc"></div>
        </div>
      </div>
      <div class="change-model-modal__footer">
        <button class="change-model-modal__btn" id="change-model-cancel">Отменить</button>
        <button class="change-model-modal__btn change-model-modal__btn--primary"
          id="change-model-save">Сохранить</button>
      </div>
    </div>
  </div>
  <div class="change-model-overlay" id="change-model-hyperparams-overlay" style="display:none">
    <div class="change-model-modal">
      <div class="change-model-modal__header">
        <h3 class="change-model-modal__title">Изменить гиперпараметры модели</h3>
        <button class="change-model-modal__close" id="change-model-hyperparams-close" aria-label="Закрыть">&times;</button>
      </div>
      <div class="change-model-modal__body">
        <div class="model-input-box">
          <label for="model-epochs">epochs</label>
          <input type="number" id="model-epochs">
        </div>
        <div class="model-input-box">
          <label for="model-batch-size">batch_size</label>
          <input type="number" id="model-batch-size">
        </div>
        <div class="model-input-box">
          <label for="model-learning-rate">learning_rate</label>
          <input type="number" id="model-learning-rate">
        </div>
        <div class="model-input-box">
          <label for="model-imgsz">imgsz</label>
          <input type="number" id="model-imgsz">
        </div>
        <div class="model-input-box">
          <label for="model-optimizer">optimizer</label>
          <input type="text" id="model-optimizer">
        </div>
        <div class="model-input-box">
        <label class="change-model-modal__label" for="model-device">Выберите устройство обработки:</label>
        <select class="change-model-modal__select" id="model-device">
          <option value="cuda">cuda</option>
          <option value="cpu">cpu</option>
        </select>
        </div>
      </div>
      <div class="change-model-modal__footer">
        <button class="change-model-modal__btn" id="change-model-hyperparams-cancel">Отменить</button>
        <button class="change-model-modal__btn change-model-modal__btn--primary"
          id="change-model-hyperparams-save">Сохранить</button>
      </div>
    </div>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script type="module" src="/js/work.js" defer></script>
</body>

</html>
