<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>BestSoftWeb</title>

    <link rel="shortcut icon" href="/img/svg/logo.svg" type="image/x-icon" />

    <link rel="stylesheet" href="/css/fonts/inter.css" />
    <link rel="stylesheet" href="/css/root.css" />
    <link rel="stylesheet" href="/css/minimize.css" />
    <link rel="stylesheet" href="/css/app/app.css" />
    <link rel="stylesheet" href="/css/animations.css" />
    <link rel="stylesheet" href="/css/header/header.css" />
    <link rel="stylesheet" href="/css/footer/footer.css" />

    <link rel="stylesheet" href="/css/datasetsPage/datasetsPage.css">
    <link rel="stylesheet" href="/css/datasetsPage/sectionDatasetsHeader.css">
    <link rel="stylesheet" href="/css/datasetsPage/sectionDatasetsCards.css">

    <link rel="stylesheet" href="/css/datasetsPage/interactions.css">

    <link rel="stylesheet" href="/css/popup/popup.css">

  </head>
  <body>
    <header class="header">
      <nav class="header__navigation">
        <a class="header__link header__link--logo" href="/">BestSoftWeb</a>
        <a class="header__link" href="/work">Рабочая область</a>
        <a class="header__link" href="/datasets">Датасеты</a>
        <a class="header__link header__link--profile" href="/stats"></a>
      </nav>
    </header>
    <main id="app">
      <h1 class="datasets-page-title">Датасеты</h1>

      <section class="section-datasets-header">
        <h2 class="section-datasets-header__subtitle">
          Управление и мониторинг наборов данных для компьютерного зрения
        </h2>
        <button class="section-datasets-header__button section-datasets-header__button--upload-new-dataset">
          <img
            class="section-datasets-header__image"
            src="/img/svg/plus-icon.svg"
            alt="plus-icon"
          />
          Новый датасет
        </button>
      </section>

      <section class="section-datasets-cards">
        <nav class="section-datasets-cards__navigation">
          <ul class="section-datasets-cards__menu">
            <li class="section-datasets-cards__menu-item">
              <button
                class="section-datasets-cards__menu-button section-datasets-cards__menu-button--active"
              >
                Все наборы
                <span
                  class="section-datasets-cards__menu-counter section-datasets-cards__menu-counter--light"
                  >4</span
                >
              </button>
            </li>
            <li class="section-datasets-cards__menu-item">
              <button class="section-datasets-cards__menu-button">
                В процессе
                <span class="section-datasets-cards__menu-counter section-datasets-cards__menu-counter--light">1</span>
              </button>
            </li>
            <li class="section-datasets-cards__menu-item">
              <button class="section-datasets-cards__menu-button">
                Ожидает проверки
                <span class="section-datasets-cards__menu-counter section-datasets-cards__menu-counter--light">1</span>
              </button>
            </li>
            <li class="section-datasets-cards__menu-item">
              <button class="section-datasets-cards__menu-button">
                Завершено
                <span class="section-datasets-cards__menu-counter section-datasets-cards__menu-counter--light">1</span>
              </button>
            </li>
          </ul>
        </nav>
        <ul class="section-datasets-cards__cards">
        </ul>
      </section>
    </main>
    <footer class="footer">
      <p class="footer-text">@Команда крутых перцев</p>
    </footer>
    <div></div>

    <template id="dataset-card--just-load">
      <li class="section-datasets-cards__card">
        <div class="section-datasets-cards__card-preview-box">
          <img
            class="section-datasets-cards__card-image"
            data-field="dataset-card-preview-image"
            src=""
            alt="dataset-card-preview-image"
          />
          <div class="section-datasets-cards__count-images-box">
            <img
              class="section-datasets-cards__image-icon"
              src="/img/svg/image-icon.svg"
              alt="image-icon"
            />
            <span class="section-datasets-cards__count-images-text" data-field="count-images-text">
              
            </span>
          </div>
        </div>
        <div class="section-datasets-cards__card-data">
          <h3 class="section-datasets-cards__card-title" data-field="dataset-name"></h3>
          <h4 class="section-datasets-cards__card-time" data-field="dataset-last-activity">

          </h4>
          <div class="section-datasets-cards__card-status-box">
            <div class="section-datasets-cards__card-text-status-box">
              <div class="section-datasets-cards__card-progres-status-box">
                <img
                  class="section-datasets-cards__card-progres-image"
                  src="/img/svg/nstart-icon.svg"
                  alt="in-progress-icon"
                />
                <span
                  class="section-datasets-cards__card-progres-text section-datasets-cards__card-progres-text--nstarted"
                  >Не начато</span
                >
              </div>
              <span class="section-datasets-cards__card-text-percent" data-field="dataset-percent"
                ></span
              >
            </div>
            <input
              class="section-datasets-cards__card-input"
              type="range"
              disabled
              value="0"
            />
            <h4 class="section-datasets-cards__card-fraction-text-status" data-field="dataset-count-fraction">
              
            </h4>
          </div>
          <button class="section-datasets-cards__card-button">
            <img
              class="section-datasets-cards__card-button-image"
              src="/img/svg/to-markup-icon.svg"
              alt="goto-markup-icon"
            />
            Начать разметку
          </button>
        </div>
      </li>
    </template>
    <template id="dataset-card--in-progress">
      <li class="section-datasets-cards__card">
        <div class="section-datasets-cards__card-preview-box">
          <img
            class="section-datasets-cards__card-image"
            data-field="dataset-card-preview-image"
            src=""
            alt="dataset-card-preview-image"
          />
          <div class="section-datasets-cards__count-images-box">
            <img
              class="section-datasets-cards__image-icon"
              src="/img/svg/image-icon.svg"
              alt="image-icon"
            />
            <span class="section-datasets-cards__count-images-text" data-field="count-images-text"></span>
          </div>
        </div>
        <div class="section-datasets-cards__card-data">
          <h3 class="section-datasets-cards__card-title" data-field="dataset-name"></h3>
          <h4 class="section-datasets-cards__card-time" data-field="dataset-last-activity"></h4>
          <div class="section-datasets-cards__card-status-box">
            <div class="section-datasets-cards__card-text-status-box">
              <div class="section-datasets-cards__card-progres-status-box">
                <img
                  class="section-datasets-cards__card-progres-image"
                  src="/img/svg/in-progress-icon.svg"
                  alt="in-progress-icon"
                />
                <span class="section-datasets-cards__card-progres-text">В процессе</span>
              </div>
              <span class="section-datasets-cards__card-text-percent" data-field="dataset-percent"></span>
            </div>
            <input
              class="section-datasets-cards__card-input"
              type="range"
              disabled
              data-field="dataset-range"
            />
            <h4 class="section-datasets-cards__card-fraction-text-status" data-field="dataset-count-fraction"></h4>
          </div>
          <button class="section-datasets-cards__card-button">
            <img
              class="section-datasets-cards__card-button-image"
              src="/img/svg/goto-markup-icon.svg"
              alt="goto-markup-icon"
            />
            Продолжить разметку
          </button>
        </div>
      </li>
    </template>
    <template id="dataset-card--check-status">
      <li class="section-datasets-cards__card">
        <div class="section-datasets-cards__card-preview-box">
          <img
            class="section-datasets-cards__card-image"
            data-field="dataset-card-preview-image"
            src=""
            alt="dataset-card-preview-image"
          />
          <div class="section-datasets-cards__count-images-box">
            <img
              class="section-datasets-cards__image-icon"
              src="/img/svg/image-icon.svg"
              alt="image-icon"
            />
            <span class="section-datasets-cards__count-images-text" data-field="count-images-text"></span>
          </div>
        </div>
        <div class="section-datasets-cards__card-data">
          <h3 class="section-datasets-cards__card-title" data-field="dataset-name"></h3>
          <h4 class="section-datasets-cards__card-time" data-field="dataset-last-activity"></h4>
          <div class="section-datasets-cards__card-status-box">
            <div class="section-datasets-cards__card-text-status-box">
              <div class="section-datasets-cards__card-progres-status-box">
                <img
                  class="section-datasets-cards__card-progres-image"
                  src="/img/svg/wait-check-icon.svg"
                  alt="wait-check-icon"
                />
                <span class="section-datasets-cards__card-progres-text section-datasets-cards__card-progres-text--check-status">Ожидает проверки</span>
              </div>
              <span class="section-datasets-cards__card-text-percent" data-field="dataset-percent"></span>
            </div>
            <input
              class="section-datasets-cards__card-input section-datasets-cards__card-input--check-status"
              type="range"
              disabled
              data-field="dataset-range"
            />
            <h4 class="section-datasets-cards__card-fraction-text-status" data-field="dataset-count-fraction"></h4>
          </div>
          <button class="section-datasets-cards__card-button section-datasets-cards__card-button--check-status">
            <img
              class="section-datasets-cards__card-button-image"
              src="/img/svg/check-icon.svg"
              alt="check-icon"
            />
            Проверить разметку
          </button>
        </div>
      </li>
    </template>
    <template id="dataset-card--complete">
      <li class="section-datasets-cards__card">
        <div class="section-datasets-cards__card-preview-box">
          <img
            class="section-datasets-cards__card-image"
            data-field="dataset-card-preview-image"
            src=""
            alt="dataset-card-preview-image"
          />
          <div class="section-datasets-cards__count-images-box">
            <img
              class="section-datasets-cards__image-icon"
              src="/img/svg/image-icon.svg"
              alt="image-icon"
            />
            <span class="section-datasets-cards__count-images-text" data-field="count-images-text"></span>
          </div>
        </div>
        <div class="section-datasets-cards__card-data">
          <h3 class="section-datasets-cards__card-title" data-field="dataset-name"></h3>
          <h4 class="section-datasets-cards__card-time" data-field="dataset-last-activity"></h4>
          <div class="section-datasets-cards__card-status-box">
            <div class="section-datasets-cards__card-text-status-box">
              <div class="section-datasets-cards__card-progres-status-box">
                <img
                  class="section-datasets-cards__card-progres-image"
                  src="/img/svg/done-icon.svg"
                  alt="done-icon"
                />
                <span class="section-datasets-cards__card-progres-text section-datasets-cards__card-progres-text--complete">Завершено</span>
              </div>
              <span class="section-datasets-cards__card-text-percent" data-field="dataset-percent"></span>
            </div>
            <input
              class="section-datasets-cards__card-input section-datasets-cards__card-input--complete"
              type="range"
              disabled
              data-field="dataset-range"
            />
            <h4 class="section-datasets-cards__card-fraction-text-status" data-field="dataset-count-fraction"></h4>
          </div>
          <button class="section-datasets-cards__card-button section-datasets-cards__card-button--complete">
            Готово
          </button>
        </div>
      </li>
    </template>

  </body>
  <script type="module" src="/js/datasets.js"></script>
</html>
